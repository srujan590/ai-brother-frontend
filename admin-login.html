<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Brother | Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );
        }

        .admin-container {
            width: 90%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 28px;
            color: #111827;
        }

        .logo p {
            margin-top: 6px;
            color: #64748b;
            font-size: 14px;
        }

        .admin-badge {
            text-align: center;
            margin-bottom: 25px;
        }

        .admin-badge span {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #dc2626;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="admin-container">

        <div class="logo">
            <h1>🤖 AI Brother</h1>
            <p>Management Console</p>
        </div>

        <div class="admin-badge">
            <span>🔐 Administrator Access</span>
        </div>

        <form id="admin-login-form">

            <div class="form-group">

                <label for="username">
                    Admin Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter admin username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Admin Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
                id="login-btn"
            >
                Login to Admin Panel
            </button>

            <div
                id="message"
                class="message">
            </div>

        </form>

        <div class="footer">
            AI Brother Administration System
        </div>

    </div>

    <script>

        const form =
            document.getElementById(
                "admin-login-form"
            );

        const button =
            document.getElementById(
                "login-btn"
            );

        const message =
            document.getElementById(
                "message"
            );

        form.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                button.disabled = true;

                button.textContent =
                    "Authenticating...";

                message.textContent = "";

                try {

                    const response =
                        await fetch(
                            "https://ai-brother-backend.onrender.com/admin/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    username:
                                        username,
                                    password:
                                        password
                                })
                            }
                        );

                    const data =
                        await response.json();

                    if (response.ok) {

                        localStorage.setItem(
                            "adminToken",
                            data.token
                        );

                        window.location.href =
                            "admin.html";

                    } else {

                        message.textContent =
                            data.detail ||
                            "Invalid admin credentials.";

                    }

                } catch (error) {

                    console.error(
                        "ADMIN LOGIN ERROR:",
                        error
                    );

                    message.textContent =
                        "Cannot connect to backend.";

                }

                button.disabled = false;

                button.textContent =
                    "Login to Admin Panel";

            }
        );

    </script>

</body>

</html>
