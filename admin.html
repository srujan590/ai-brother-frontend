<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Brother | Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8fafc;
            color: #0f172a;
        }

        /* ==============================
           NAVBAR
        ============================== */

        .navbar {
            height: 70px;
            background: #0f172a;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar span {
            color: #94a3b8;
            font-size: 13px;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;

            padding: 9px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* ==============================
           MAIN
        ============================== */

        .container {
            width: 92%;
            max-width: 1200px;

            margin: 35px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 28px;
        }

        .page-title p {
            margin-top: 6px;
            color: #64748b;
        }

        /* ==============================
           STAT CARD
        ============================== */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;

            margin-bottom: 30px;
        }

        .stat-card {
            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(15, 23, 42, 0.06);

            border: 1px solid #e2e8f0;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #4f46e5;
        }

        /* ==============================
           USERS CARD
        ============================== */

        .users-card {
            background: white;

            border-radius: 14px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 5px 20px rgba(15, 23, 42, 0.06);

            overflow: hidden;
        }

        .users-header {
            padding: 22px 25px;

            border-bottom: 1px solid #e2e8f0;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .users-header h3 {
            font-size: 19px;
        }

        .refresh-btn {
            border: none;

            background: #4f46e5;

            color: white;

            padding: 9px 15px;

            border-radius: 8px;

            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #4338ca;
        }

        /* ==============================
           TABLE
        ============================== */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 20px;

            text-align: left;

            border-bottom:
                1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;

            color: #475569;

            font-size: 13px;

            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* ==============================
           STATUS
        ============================== */

        .status {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            background: #dcfce7;

            color: #166534;

            font-size: 12px;

            font-weight: bold;
        }

        /* ==============================
           EMPTY / LOADING
        ============================== */

        .message {
            padding: 40px;

            text-align: center;

            color: #64748b;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 18px;
            }

            .navbar h1 {
                font-size: 18px;
            }

            .navbar span {
                display: none;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .page-title h2 {
                font-size: 23px;
            }

            .users-header {
                padding: 18px;
            }

            th,
            td {
                padding: 12px;
            }

        }

    </style>

</head>

<body>

    <!-- ==============================
         NAVBAR
    ============================== -->

    <nav class="navbar">

        <div>
            <h1>🤖 AI Brother Admin</h1>
            <span>Management Console</span>
        </div>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </nav>


    <!-- ==============================
         MAIN
    ============================== -->

    <main class="container">

        <div class="page-title">

            <h2>Dashboard</h2>

            <p>
                Manage and monitor registered AI Brother users.
            </p>

        </div>


        <!-- ==============================
             STATISTICS
        ============================== -->

        <section class="stats">

            <div class="stat-card">

                <h3>Total Registered Users</h3>

                <div
                    class="stat-number"
                    id="total-users">
                    —
                </div>

            </div>

        </section>


        <!-- ==============================
             USERS
        ============================== -->

        <section class="users-card">

            <div class="users-header">

                <h3>Registered Users</h3>

                <button
                    class="refresh-btn"
                    onclick="loadUsers()">
                    ↻ Refresh
                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="users-table">

                        <tr>

                            <td
                                colspan="4"
                                class="message">

                                Loading users...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        const BACKEND_URL =
            "https://ai-brother-backend.onrender.com";


        // ==========================================
        // CHECK ADMIN AUTHENTICATION
        // ==========================================

        const token =
            localStorage.getItem("adminToken");


        if (!token) {

            window.location.href =
                "admin-login.html";

        }


        // ==========================================
        // LOAD USERS
        // ==========================================

        async function loadUsers() {

            const table =
                document.getElementById(
                    "users-table"
                );

            try {

                table.innerHTML = `
                    <tr>
                        <td colspan="4"
                            class="message">
                            Loading users...
                        </td>
                    </tr>
                `;


                const response =
                    await fetch(
                        `${BACKEND_URL}/admin/users`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                if (response.status === 401) {

                    localStorage.removeItem(
                        "adminToken"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Unable to load users."
                    );

                }


                document.getElementById(
                    "total-users"
                ).textContent =
                    data.total_users;


                if (
                    !data.users ||
                    data.users.length === 0
                ) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="4"
                                class="message">
                                No registered users found.
                            </td>
                        </tr>
                    `;

                    return;

                }


                table.innerHTML =
                    data.users.map(
                        user => `
                            <tr>

                                <td>
                                    ${user.id}
                                </td>

                                <td>
                                    <strong>
                                        ${user.name}
                                    </strong>
                                </td>

                                <td>
                                    ${user.email}
                                </td>

                                <td>
                                    <span
                                        class="status">
                                        Active
                                    </span>
                                </td>

                            </tr>
                        `
                    ).join("");


            } catch (error) {

                console.error(
                    "LOAD USERS ERROR:",
                    error
                );

                table.innerHTML = `
                    <tr>
                        <td colspan="4"
                            class="message">
                            Unable to load users.
                        </td>
                    </tr>
                `;

            }

        }


        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            localStorage.removeItem(
                "adminToken"
            );

            window.location.href =
                "admin-login.html";

        }


        // ==========================================
        // INITIAL LOAD
        // ==========================================

        loadUsers();

    </script>

</body>

</html>
