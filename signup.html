<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Brother • Create Account</title>

    <link rel="stylesheet" href="signup.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="background">

    <div class="blur circle1"></div>

    <div class="blur circle2"></div>

    <div class="blur circle3"></div>

</div>

<div class="signup-page">

<div class="signup-card">

<div class="logo">

<div class="logo-circle">

AI

</div>

<h1>

AI Brother

</h1>

<p>

Create your AI Workspace

</p>

</div>

<form id="signup-form">

<div class="input-group">

<label>

Full Name

</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

</div>

<div class="input-group">

<label>

Email Address

</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>

Password

</label>

<input
type="password"
id="password"
placeholder="Create a password"
required>

</div>

<div class="input-group">

<label>

Confirm Password

</label>

<input
type="password"
id="confirm-password"
placeholder="Confirm your password"
required>

</div>

<button
type="submit"
class="signup-btn">

Create Account →

</button>

<div class="divider">

<span>

OR

</span>

</div>

<button
type="button"
class="google-btn">

<img
src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
width="22">

Continue with Google

</button>

<div class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</form>

</div>

<footer>

Built with ❤️ by Sujju

</footer>

</div>

<script src="signup.js"></script>

</body>

</html>
